<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>卡娜赫拉的粉紅俄羅斯方塊 🐰🐥</title>
    <style>
        :root {
            --kana-pink: #ff75a0;
            --kana-light-pink: #ffafbd;
            --kana-bg: #fff0f5;
            --kana-yellow: #ffb830;
            --card-bg: #ffffff;
            --text-color: #5c3d46;
        }

        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; touch-action: manipulation; }

        body {
            font-family: "Comic Sans MS", "Chalkboard SE", "微軟正黑體", sans-serif;
            background-color: var(--kana-bg);
            color: var(--text-color);
            margin: 0; padding: 0;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; min-height: 100dvh;
            overflow: hidden;
        }

        .game-container {
            width: 100%; max-width: 420px; height: 100vh; height: 100dvh;
            display: flex; flex-direction: column; justify-content: space-between;
            padding: 10px; position: relative;
        }

        /* Top Bar & Score Header */
        .header {
            display: flex; justify-content: space-between; align-items: center;
            background: var(--card-bg); padding: 8px 15px; border-radius: 20px;
            box-shadow: 0 4px 15px rgba(255, 117, 160, 0.2);
            border: 2px solid var(--kana-light-pink);
        }
        .title-box { display: flex; align-items: center; gap: 6px; font-weight: bold; font-size: 1.1rem; color: var(--kana-pink); }
        .score-box { text-align: right; }
        .score-box div { font-size: 0.75rem; color: #888; }
        .score-box span { font-size: 1.2rem; font-weight: bold; color: var(--kana-pink); }

        /* Main Game Layout */
        .main-area {
            display: flex; gap: 10px; justify-content: center; align-items: flex-start;
            margin: 10px 0; flex: 1;
        }

        /* Tetris Canvas Frame */
        .canvas-frame {
            background: var(--card-bg); border-radius: 18px; padding: 8px;
            border: 4px solid var(--kana-pink);
            box-shadow: 0 8px 20px rgba(255, 117, 160, 0.15);
            display: flex; justify-content: center; align-items: center;
        }
        canvas#tetris {
            background: #fff8f9; border-radius: 10px; display: block;
        }

        /* Sidebar Info */
        .sidebar {
            display: flex; flex-direction: column; gap: 10px; width: 100px;
        }
        .info-card {
            background: var(--card-bg); border-radius: 15px; padding: 10px;
            border: 2px solid var(--kana-light-pink); text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
        }
        .info-title { font-size: 0.8rem; font-weight: bold; color: var(--kana-pink); margin-bottom: 5px; }
        canvas#next { background: #fff8f9; border-radius: 8px; margin: 0 auto; display: block; }

        .avatar-box { font-size: 2.5rem; line-height: 1; margin-top: 5px; }

        /* Touch Controls */
        .controls {
            display: flex; flex-direction: column; gap: 8px; width: 100%;
            margin-bottom: 5px;
        }
        .btn-row { display: flex; gap: 8px; justify-content: center; width: 100%; }
        .ctrl-btn {
            background: #ffffff; border: 2px solid var(--kana-light-pink);
            border-bottom: 5px solid var(--kana-pink); border-radius: 16px;
            flex: 1; padding: 12px 0; font-size: 1.3rem; font-weight: bold;
            color: var(--text-color); cursor: pointer; text-align: center;
            transition: all 0.05s;
        }
        .ctrl-btn:active {
            transform: translateY(3px); border-bottom-width: 2px; background: #fff5f7;
        }
        .ctrl-btn.hard-drop {
            background: linear-gradient(135deg, #ff9a9e, #fecfef);
            color: #fff; border-color: #ff75a0; border-bottom-color: #e84393;
        }

        /* Modal Overlay */
        .modal {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 240, 245, 0.85); backdrop-filter: blur(4px);
            z-index: 100; display: flex; flex-direction: column;
            justify-content: center; align-items: center; text-align: center;
            padding: 20px;
        }
        .modal-card {
            background: #fff; border: 4px solid var(--kana-pink);
            border-radius: 25px; padding: 25px 20px; width: 85%; max-width: 320px;
            box-shadow: 0 10px 30px rgba(255, 117, 160, 0.3);
        }
        .start-btn {
            background: linear-gradient(135deg, #ff75a0, #ffafbd);
            border: none; border-bottom: 5px solid #d63031;
            color: #fff; font-size: 1.3rem; font-weight: bold;
            padding: 12px 30px; border-radius: 50px; margin-top: 15px;
            cursor: pointer; width: 100%;
        }
        .start-btn:active { transform: translateY(2px); border-bottom-width: 2px; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="game-container">
        <!-- Header HUD -->
        <div class="header">
            <div class="title-box">
                <span id="title-avatar">🐰</span> 卡娜俄羅斯
            </div>
            <div class="score-box">
                <div>SCORE</div>
                <span id="score">0</span>
            </div>
        </div>

        <!-- Canvas Area -->
        <div class="main-area">
            <div class="canvas-frame">
                <canvas id="tetris" width="200" height="400"></canvas>
            </div>

            <div class="sidebar">
                <div class="info-card">
                    <div class="info-title">NEXT</div>
                    <canvas id="next" width="80" height="80"></canvas>
                </div>
                <div class="info-card">
                    <div class="info-title">LEVEL</div>
                    <span id="level" style="font-weight:bold; font-size:1.2rem; color:var(--kana-pink);">1</span>
                </div>
                <div class="info-card">
                    <div class="info-title">LINES</div>
                    <span id="lines" style="font-weight:bold; font-size:1.2rem; color:var(--text-color);">0</span>
                </div>
                <div class="avatar-box" id="side-avatar">🐥</div>
            </div>
        </div>

        <!-- Touch Controls -->
        <div class="controls">
            <div class="btn-row">
                <button class="ctrl-btn" onclick="playerRotate()">🔄 旋轉</button>
                <button class="ctrl-btn hard-drop" onclick="playerHardDrop()">⚡ 沉底</button>
            </div>
            <div class="btn-row">
                <button class="ctrl-btn" onclick="playerMove(-1)">⬅️</button>
                <button class="ctrl-btn" onclick="playerDrop()">⬇️</button>
                <button class="ctrl-btn" onclick="playerMove(1)">➡️</button>
            </div>
        </div>

        <!-- Start / Game Over Modal -->
        <div id="game-modal" class="modal">
            <div class="modal-card">
                <div style="font-size: 3.5rem; margin-bottom: 10px;" id="modal-icon">🐰🐥</div>
                <h2 id="modal-title" style="color:var(--kana-pink); margin: 5px 0;">粉紅俄羅斯方塊</h2>
                <p id="modal-desc" style="color:#777; font-size:0.9rem; margin-bottom:15px;">陪伴你的舒壓遊戲時間 💕</p>
                <button class="start-btn" onclick="startGame()">開始遊戲 🌸</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('tetris');
        const context = canvas.getContext('2d');
        const nextCanvas = document.getElementById('next');
        const nextContext = nextCanvas.getContext('2d');

        context.scale(20, 20);
        nextContext.scale(20, 20);

        // 卡娜赫拉馬卡龍可愛配色
        const colors = [
            null,
            '#ff75a0', // 粉紅兔兔色
            '#ffb830', // P助黃色
            '#6c5ce7', // 夢幻紫
            '#00b894', // 薄荷綠
            '#00cec9', // 水藍
            '#ff7675', // 珊瑚紅
            '#fdcb6e'  // 奶油黃
        ];

        // 方塊形狀定義
        function createPiece(type) {
            if (type === 'I') return [[0, 1, 0, 0],[0, 1, 0, 0],[0, 1, 0, 0],[0, 1, 0, 0]];
            if (type === 'L') return [[0, 2, 0],[0, 2, 0],[0, 2, 2]];
            if (type === 'J') return [[0, 3, 0],[0, 3, 0],[3, 3, 0]];
            if (type === 'O') return [[4, 4],[4, 4]];
            if (type === 'Z') return [[5, 5, 0],[0, 5, 5],[0, 0, 0]];
            if (type === 'S') return [[0, 6, 6],[6, 6, 0],[0, 0, 0]];
            if (type === 'T') return [[0, 7, 0],[7, 7, 7],[0, 0, 0]];
        }

        const arena = createMatrix(10, 20);
        const player = {
            pos: {x: 0, y: 0},
            matrix: null,
            next: null,
            score: 0,
            lines: 0,
            level: 1
        };

        let dropCounter = 0;
        let dropInterval = 1000;
        let lastTime = 0;
        let isGameOver = true;

        function createMatrix(w, h) {
            const matrix = [];
            while (h--) matrix.push(new Array(w).fill(0));
            return matrix;
        }

        function draw() {
            context.fillStyle = '#fff8f9';
            context.fillRect(0, 0, canvas.width, canvas.height);

            drawMatrix(arena, {x: 0, y: 0});
            drawGhost(); // 繪制投影 (Ghost Piece)
            drawMatrix(player.matrix, player.pos);
        }

        function drawNext() {
            nextContext.fillStyle = '#fff8f9';
            nextContext.fillRect(0, 0, nextCanvas.width, nextCanvas.height);
            if (player.next) {
                drawMatrixOnContext(nextContext, player.next, {x: 1, y: 1});
            }
        }

        function drawMatrix(matrix, offset) {
            drawMatrixOnContext(context, matrix, offset);
        }

        function drawMatrixOnContext(ctx, matrix, offset) {
            matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) {
                        ctx.fillStyle = colors[value];
                        ctx.fillRect(x + offset.x, y + offset.y, 0.9, 0.9);
                        // 圓角粉嫩感細節
                        ctx.strokeStyle = '#ffffff';
                        ctx.lineWidth = 0.05;
                        ctx.strokeRect(x + offset.x, y + offset.y, 0.9, 0.9);
                    }
                });
            });
        }

        // 隱形投影 (Hard Drop 預覽)
        function drawGhost() {
            if (!player.matrix) return;
            const ghostPos = {x: player.pos.x, y: player.pos.y};
            while (!collide(arena, {pos: ghostPos, matrix: player.matrix})) {
                ghostPos.y++;
            }
            ghostPos.y--;

            player.matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) {
                        context.fillStyle = 'rgba(255, 117, 160, 0.2)';
                        context.fillRect(x + ghostPos.x, y + ghostPos.y, 0.9, 0.9);
                    }
                });
            });
        }

        function merge(arena, player) {
            player.matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) {
                        arena[y + player.pos.y][x + player.pos.x] = value;
                    }
                });
            });
        }

        function collide(arena, player) {
            const [m, o] = [player.matrix, player.pos];
            for (let y = 0; y < m.length; ++y) {
                for (let x = 0; x < m[y].length; ++x) {
                    if (m[y][x] !== 0 && (arena[y + o.y] && arena[y + o.y][x + o.x]) !== 0) {
                        return true;
                    }
                }
            }
            return false;
        }

        function arenaSweep() {
            let rowCount = 1;
            let clearedLines = 0;
            outer: for (let y = arena.length - 1; y >= 0; --y) {
                for (let x = 0; x < arena[y].length; ++x) {
                    if (arena[y][x] === 0) continue outer;
                }
                const row = arena.splice(y, 1)[0].fill(0);
                arena.unshift(row);
                ++y;

                player.score += rowCount * 10;
                rowCount *= 2;
                clearedLines++;
            }

            if (clearedLines > 0) {
                player.lines += clearedLines;
                player.level = Math.floor(player.lines / 10) + 1;
                dropInterval = Math.max(100, 1000 - (player.level - 1) * 100);
                updateScore();
            }
        }

        function playerDrop() {
            player.pos.y++;
            if (collide(arena, player)) {
                player.pos.y--;
                merge(arena, player);
                playerReset();
                arenaSweep();
            }
            dropCounter = 0;
        }

        function playerHardDrop() {
            while (!collide(arena, player)) {
                player.pos.y++;
            }
            player.pos.y--;
            merge(arena, player);
            playerReset();
            arenaSweep();
            dropCounter = 0;
        }

        function playerMove(dir) {
            player.pos.x += dir;
            if (collide(arena, player)) {
                player.pos.x -= dir;
            }
        }

        function playerRotate() {
            const pos = player.pos.x;
            let offset = 1;
            rotate(player.matrix);
            while (collide(arena, player)) {
                player.pos.x += offset;
                offset = -(offset + (offset > 0 ? 1 : -1));
                if (offset > player.matrix[0].length) {
                    rotate(player.matrix, -1);
                    player.pos.x = pos;
                    return;
                }
            }
        }

        function rotate(matrix, dir = 1) {
            for (let y = 0; y < matrix.length; ++y) {
                for (let x = 0; x < y; ++x) {
                    [matrix[x][y], matrix[y][x]] = [matrix[y][x], matrix[x][y]];
                }
            }
            if (dir > 0) matrix.forEach(row => row.reverse());
            else matrix.reverse();
        }

        function getRandomPiece() {
            const pieces = 'IJLSZOT';
            return createPiece(pieces[pieces.length * Math.random() | 0]);
        }

        function playerReset() {
            if (!player.next) player.next = getRandomPiece();
            player.matrix = player.next;
            player.next = getRandomPiece();
            player.pos.y = 0;
            player.pos.x = (arena[0].length / 2 | 0) - (player.matrix[0].length / 2 | 0);

            drawNext();

            if (collide(arena, player)) {
                isGameOver = true;
                document.getElementById('modal-icon').innerText = "💔";
                document.getElementById('modal-title').innerText = "Game Over";
                document.getElementById('modal-desc').innerText = `獲得得分: ${player.score}`;
                document.getElementById('game-modal').classList.remove('hidden');
            }
        }

        function updateScore() {
            document.getElementById('score').innerText = player.score;
            document.getElementById('level').innerText = player.level;
            document.getElementById('lines').innerText = player.lines;
        }

        function update(time = 0) {
            if (isGameOver) return;

            const deltaTime = time - lastTime;
            lastTime = time;
            dropCounter += deltaTime;

            if (dropCounter > dropInterval) {
                playerDrop();
            }

            draw();
            requestAnimationFrame(update);
        }

        function startGame() {
            arena.forEach(row => row.fill(0));
            player.score = 0;
            player.lines = 0;
            player.level = 1;
            dropInterval = 1000;
            isGameOver = false;
            updateScore();
            playerReset();
            document.getElementById('game-modal').classList.add('hidden');
            requestAnimationFrame(update);
        }

        // 鍵盤監聽
        document.addEventListener('keydown', event => {
            if (isGameOver) return;
            if (event.keyCode === 37) playerMove(-1);        // Left Arrow
            else if (event.keyCode === 39) playerMove(1);   // Right Arrow
            else if (event.keyCode === 40) playerDrop();     // Down Arrow
            else if (event.keyCode === 38) playerRotate();   // Up Arrow
            else if (event.keyCode === 32) playerHardDrop(); // Space
        });
    </script>
</body>
</html>
