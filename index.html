<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>卡娜赫拉的粉紅俄羅斯方塊 🐰🐥</title>
    <style>
        :root {
            --kana-pink: #ff75a0;
            --kana-light-pink: #ffafbd;
            --kana-bg: #fff0f5;
            --kana-yellow: #ffb830;
            --card-bg: #ffffff;
            --text-color: #5c3d46;
        }

        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; touch-action: manipulation; }

        body {
            font-family: "Comic Sans MS", "Chalkboard SE", "微軟正黑體", sans-serif;
            background-color: var(--kana-bg);
            background-image: url('bg.jpg');
            background-size: cover;
            background-position: center;
            color: var(--text-color);
            margin: 0; padding: 0;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; min-height: 100dvh;
            overflow: hidden;
        }

        .game-container {
            width: 100%; max-width: 420px; height: 100vh; height: 100dvh;
            display: flex; flex-direction: column; justify-content: space-between;
            padding: 10px;
            padding-bottom: max(10px, env(safe-area-inset-bottom));
            position: relative;
        }

        /* Top Bar & Score Header */
        .header {
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(255, 255, 255, 0.95); padding: 8px 12px; border-radius: 20px;
            box-shadow: 0 4px 15px rgba(255, 117, 160, 0.2);
            border: 2px solid var(--kana-light-pink);
            backdrop-filter: blur(5px);
        }
        .title-box { display: flex; align-items: center; gap: 6px; font-weight: bold; font-size: 1rem; color: var(--kana-pink); }
        .header-btn-group { display: flex; gap: 6px; align-items: center; }
        .hud-icon-btn {
            background: #fff; border: 2px solid var(--kana-light-pink); border-radius: 50%;
            width: 36px; height: 36px; font-size: 1rem; cursor: pointer;
            display: flex; justify-content: center; align-items: center;
        }

        .score-box { text-align: right; }
        .score-box div { font-size: 0.7rem; color: #888; }
        .score-box span { font-size: 1.1rem; font-weight: bold; color: var(--kana-pink); }

        /* Main Game Layout */
        .main-area {
            display: flex; gap: 10px; justify-content: center; align-items: flex-start;
            margin: 8px 0; flex: 1; min-height: 0;
        }

        /* Tetris Canvas Frame */
        .canvas-frame {
            background: rgba(255, 255, 255, 0.95); border-radius: 18px; padding: 6px;
            border: 4px solid var(--kana-pink);
            box-shadow: 0 8px 20px rgba(255, 117, 160, 0.15);
            display: flex; justify-content: center; align-items: center;
        }
        canvas#tetris {
            background: #fff8f9; border-radius: 10px; display: block;
        }

        /* Sidebar Info */
        .sidebar {
            display: flex; flex-direction: column; gap: 8px; width: 95px;
        }
        .info-card {
            background: rgba(255, 255, 255, 0.95); border-radius: 15px; padding: 8px;
            border: 2px solid var(--kana-light-pink); text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
        }
        .info-title { font-size: 0.75rem; font-weight: bold; color: var(--kana-pink); margin-bottom: 4px; }
        canvas#next { background: #fff8f9; border-radius: 8px; margin: 0 auto; display: block; }

        .avatar-box {
            display: flex; justify-content: center; align-items: center;
            height: 60px; margin-top: 4px;
        }
        .avatar-img { max-width: 100%; max-height: 100%; object-fit: contain; }

        /* Touch Controls */
        .controls {
            display: flex; flex-direction: column; gap: 8px; width: 100%;
            margin-bottom: 2px;
        }
        .btn-row { display: flex; gap: 8px; justify-content: center; width: 100%; }
        .ctrl-btn {
            background: #ffffff; border: 2px solid var(--kana-light-pink);
            border-bottom: 5px solid var(--kana-pink); border-radius: 16px;
            flex: 1; padding: 12px 0; font-size: 1.2rem; font-weight: bold;
            color: var(--text-color); cursor: pointer; text-align: center;
            transition: all 0.05s;
        }
        .ctrl-btn:active {
            transform: translateY(3px); border-bottom-width: 2px; background: #fff5f7;
        }
        .ctrl-btn.hard-drop {
            background: linear-gradient(135deg, #ff75a0, #ffafbd);
            color: #fff; border-color: #ff75a0; border-bottom-color: #d63031;
        }

        /* Modal Overlay */
        .modal {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 240, 245, 0.88); backdrop-filter: blur(4px);
            z-index: 100; display: flex; flex-direction: column;
            justify-content: center; align-items: center; text-align: center;
            padding: 20px;
        }
        .modal-card {
            background: #fff; border: 4px solid var(--kana-pink);
            border-radius: 25px; padding: 25px 20px; width: 85%; max-width: 320px;
            box-shadow: 0 10px 30px rgba(255, 117, 160, 0.3);
        }
        .start-btn {
            background: linear-gradient(135deg, #ff75a0, #ffafbd);
            border: none; border-bottom: 5px solid #d63031;
            color: #fff; font-size: 1.2rem; font-weight: bold;
            padding: 12px 30px; border-radius: 50px; margin-top: 15px;
            cursor: pointer; width: 100%;
        }
        .start-btn:active { transform: translateY(2px); border-bottom-width: 2px; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="game-container">
        <!-- Header HUD -->
        <div class="header">
            <div class="title-box">
                <img src="rabbit.png" id="rabbit-head-img" style="width:28px; height:28px; object-fit:contain;" onerror="this.style.display='none'; document.getElementById('emoji-head').style.display='inline';">
                <span id="emoji-head" style="display:none;">🐰</span>
                粉紅俄羅斯
            </div>
            <div class="header-btn-group">
                <button class="hud-icon-btn" id="sound-btn" onclick="toggleSound()" title="音效開關">🔊</button>
                <button class="hud-icon-btn" onclick="togglePause()" title="暫停遊戲">⏸️</button>
            </div>
            <div class="score-box">
                <div>SCORE</div>
                <span id="score">0</span>
            </div>
        </div>

        <!-- Canvas Area -->
        <div class="main-area">
            <div class="canvas-frame">
                <canvas id="tetris" width="200" height="400"></canvas>
            </div>

            <div class="sidebar">
                <div class="info-card">
                    <div class="info-title">NEXT</div>
                    <canvas id="next" width="80" height="80"></canvas>
                </div>
                <div class="info-card">
                    <div class="info-title">LEVEL</div>
                    <span id="level" style="font-weight:bold; font-size:1.1rem; color:var(--kana-pink);">1</span>
                </div>
                <div class="info-card">
                    <div class="info-title">LINES</div>
                    <span id="lines" style="font-weight:bold; font-size:1.1rem; color:var(--text-color);">0</span>
                </div>
                <div class="avatar-box">
                    <img src="piske.png" id="piske-img" class="avatar-img" onerror="this.style.display='none'; document.getElementById('piske-emoji').style.display='block';">
                    <span id="piske-emoji" style="font-size:2.2rem; display:none;">🐥</span>
                </div>
            </div>
        </div>

        <!-- Touch Controls -->
        <div class="controls">
            <div class="btn-row">
                <button class="ctrl-btn hard-drop" onclick="playerHardDrop()">⚡ 沉底</button>
                <button class="ctrl-btn" onclick="playerRotate()">🔄 旋轉</button>
            </div>
            <div class="btn-row">
                <button class="ctrl-btn" onclick="playerMove(-1)">⬅️</button>
                <button class="ctrl-btn" onclick="playerDrop()">⬇️</button>
                <button class="ctrl-btn" onclick="playerMove(1)">➡️</button>
            </div>
        </div>

        <!-- Start / Game Over / Pause Modal -->
        <div id="game-modal" class="modal">
            <div class="modal-card">
                <div style="height:80px; display:flex; justify-content:center; align-items:center; margin-bottom:10px;">
                    <img src="rabbit.png" id="modal-rabbit-img" style="max-height:100%; object-fit:contain;" onerror="this.style.display='none'; document.getElementById('modal-emoji').style.display='block';">
                    <span id="modal-emoji" style="font-size:3.5rem; display:none;">🐰🐥</span>
                </div>
                <h2 id="modal-title" style="color:var(--kana-pink); margin: 5px 0;">粉紅俄羅斯方塊</h2>
                <p id="modal-desc" style="color:#777; font-size:0.9rem; margin-bottom:15px;">陪伴你的舒壓遊戲時間 💕</p>
                <button class="start-btn" id="modal-start-btn" onclick="startGame()">開始遊戲 🌸</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('tetris');
        const context = canvas.getContext('2d');
        const nextCanvas = document.getElementById('next');
        const nextContext = nextCanvas.getContext('2d');

        context.scale(20, 20);
        nextContext.scale(20, 20);

        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;
        let soundEnabled = true;

        function initAudio() {
            if (!audioCtx) audioCtx = new AudioContext();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playSound(type) {
            if (!soundEnabled) return;
            initAudio();
            if (!audioCtx) return;

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            const now = audioCtx.currentTime;

            if (type === 'rotate') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(800, now + 0.08);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
                osc.start(now); osc.stop(now + 0.08);
            } else if (type === 'drop') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.linearRampToValueAtTime(60, now + 0.1);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
                osc.start(now); osc.stop(now + 0.1);
            } else if (type === 'clear') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(523.25, now);
                osc.frequency.setValueAtTime(659.25, now + 0.08);
                osc.frequency.setValueAtTime(783.99, now + 0.16);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
                osc.start(now); osc.stop(now + 0.25);
            } else if (type === 'gameover') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.linearRampToValueAtTime(100, now + 0.4);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.4);
                osc.start(now); osc.stop(now + 0.4);
            }
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            document.getElementById('sound-btn').innerText = soundEnabled ? '🔊' : '🔇';
        }

        const colors = [
            null, '#ff75a0', '#ffb830', '#6c5ce7', '#00b894', '#00cec9', '#ff7675', '#fdcb6e'
        ];

        function createPiece(type) {
            if (type === 'I') return [[0, 1, 0, 0],[0, 1, 0, 0],[0, 1, 0, 0],[0, 1, 0, 0]];
            if (type === 'L') return [[0, 2, 0],[0, 2, 0],[0, 2, 2]];
            if (type === 'J') return [[0, 3, 0],[0, 3, 0],[3, 3, 0]];
            if (type === 'O') return [[4, 4],[4, 4]];
            if (type === 'Z') return [[5, 5, 0],[0, 5, 5],[0, 0, 0]];
            if (type === 'S') return [[0, 6, 6],[6, 6, 0],[0, 0, 0]];
            if (type === 'T') return [[0, 7, 0],[7, 7, 7],[0, 0, 0]];
        }

        const arena = createMatrix(10, 20);
        const player = {
            pos: {x: 0, y: 0}, matrix: null, next: null,
            score: 0, lines: 0, level: 1
        };

        let dropCounter = 0;
        let dropInterval = 1000;
        let lastTime = 0;
        let isGameOver = true;
        let isPaused = false;

        function createMatrix(w, h) {
            const matrix = [];
            while (h--) matrix.push(new Array(w).fill(0));
            return matrix;
        }

        function draw() {
            context.fillStyle = '#fff8f9';
            context.fillRect(0, 0, canvas.width, canvas.height);

            drawMatrix(arena, {x: 0, y: 0});
            drawGhost();
            drawMatrix(player.matrix, player.pos);
        }

        function drawNext() {
            nextContext.fillStyle = '#fff8f9';
            nextContext.fillRect(0, 0, nextCanvas.width, nextCanvas.height);
            if (player.next) {
                drawMatrixOnContext(nextContext, player.next, {x: 1, y: 1});
            }
        }

        function drawMatrix(matrix, offset) {
            drawMatrixOnContext(context, matrix, offset);
        }

        function drawMatrixOnContext(ctx, matrix, offset) {
            matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) {
                        ctx.fillStyle = colors[value];
                        ctx.fillRect(x + offset.x, y + offset.y, 0.9, 0.9);
                        ctx.strokeStyle = '#ffffff';
                        ctx.lineWidth = 0.05;
                        ctx.strokeRect(x + offset.x, y + offset.y, 0.9, 0.9);
                    }
                });
            });
        }

        function drawGhost() {
            if (!player.matrix) return;
            const ghostPos = {x: player.pos.x, y: player.pos.y};
            while (!collide(arena, {pos: ghostPos, matrix: player.matrix})) {
                ghostPos.y++;
            }
            ghostPos.y--;

            player.matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) {
                        context.fillStyle = 'rgba(255, 117, 160, 0.25)';
                        context.fillRect(x + ghostPos.x, y + ghostPos.y, 0.9, 0.9);
                    }
                });
            });
        }

        function merge(arena, player) {
            player.matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) {
                        arena[y + player.pos.y][x + player.pos.x] = value;
                    }
                });
            });
        }

        function collide(arena, player) {
            const [m, o] = [player.matrix, player.pos];
            for (let y = 0; y < m.length; ++y) {
                for (let x = 0; x < m[y].length; ++x) {
                    if (m[y][x] !== 0 && (arena[y + o.y] && arena[y + o.y][x + o.x]) !== 0) {
                        return true;
                    }
                }
            }
            return false;
        }

        function arenaSweep() {
            let rowCount = 1;
            let clearedLines = 0;
            outer: for (let y = arena.length - 1; y >= 0; --y) {
                for (let x = 0; x < arena[y].length; ++x) {
                    if (arena[y][x] === 0) continue outer;
                }
                const row = arena.splice(y, 1)[0].fill(0);
                arena.unshift(row);
                ++y;

                player.score += rowCount * 10;
                rowCount *= 2;
                clearedLines++;
            }

            if (clearedLines > 0) {
                playSound('clear');
                player.lines += clearedLines;
                player.level = Math.floor(player.lines / 10) + 1;
                dropInterval = Math.max(100, 1000 - (player.level - 1) * 100);
                updateScore();
            }
        }

        function playerDrop() {
            if (isPaused || isGameOver) return;
            player.pos.y++;
            if (collide(arena, player)) {
                player.pos.y--;
                merge(arena, player);
                playSound('drop');
                playerReset();
                arenaSweep();
            }
            dropCounter = 0;
        }

        function playerHardDrop() {
            if (isPaused || isGameOver) return;
            while (!collide(arena, player)) {
                player.pos.y++;
            }
            player.pos.y--;
            merge(arena, player);
            playSound('drop');
            playerReset();
            arenaSweep();
            dropCounter = 0;
        }

        function playerMove(dir) {
            if (isPaused || isGameOver) return;
            player.pos.x += dir;
            if (collide(arena, player)) {
                player.pos.x -= dir;
            }
        }

        function playerRotate() {
            if (isPaused || isGameOver) return;
            const pos = player.pos.x;
            let offset = 1;
            rotate(player.matrix);
            playSound('rotate');
            while (collide(arena, player)) {
                player.pos.x += offset;
                offset = -(offset + (offset > 0 ? 1 : -1));
                if (offset > player.matrix[0].length) {
                    rotate(player.matrix, -1);
                    player.pos.x = pos;
                    return;
                }
            }
        }

        function rotate(matrix, dir = 1) {
            for (let y = 0; y < matrix.length; ++y) {
                for (let x = 0; x < y; ++x) {
                    [matrix[x][y], matrix[y][x]] = [matrix[y][x], matrix[x][y]];
                }
            }
            if (dir > 0) matrix.forEach(row => row.reverse());
            else matrix.reverse();
        }

        function getRandomPiece() {
            const pieces = 'IJLSZOT';
            return createPiece(pieces[pieces.length * Math.random() | 0]);
        }

        function playerReset() {
            if (!player.next) player.next = getRandomPiece();
            player.matrix = player.next;
            player.next = getRandomPiece();
            player.pos.y = 0;
            player.pos.x = (arena[0].length / 2 | 0) - (player.matrix[0].length / 2 | 0);

            drawNext();

            if (collide(arena, player)) {
                isGameOver = true;
                playSound('gameover');
                document.getElementById('modal-title').innerText = "Game Over";
                document.getElementById('modal-desc').innerText = `獲得總分: ${player.score}`;
                document.getElementById('modal-start-btn').innerText = "再玩一次 🌸";
                document.getElementById('game-modal').classList.remove('hidden');
            }
        }

        function togglePause() {
            if (isGameOver) return;
            isPaused = !isPaused;
            if (isPaused) {
                document.getElementById('modal-title').innerText = "遊戲暫停中";
                document.getElementById('modal-desc').innerText = `當前得分: ${player.score}`;
                document.getElementById('modal-start-btn').innerText = "繼續遊戲 ▶️";
                document.getElementById('game-modal').classList.remove('hidden');
            } else {
                document.getElementById('game-modal').classList.add('hidden');
                requestAnimationFrame(update);
            }
        }

        function updateScore() {
            document.getElementById('score').innerText = player.score;
            document.getElementById('level').innerText = player.level;
            document.getElementById('lines').innerText = player.lines;
        }

        function update(time = 0) {
            if (isGameOver || isPaused) return;

            const deltaTime = time - lastTime;
            lastTime = time;
            dropCounter += deltaTime;

            if (dropCounter > dropInterval) {
                playerDrop();
            }

            draw();
            requestAnimationFrame(update);
        }

        function startGame() {
            initAudio();
            if (isPaused) {
                isPaused = false;
                document.getElementById('game-modal').classList.add('hidden');
                requestAnimationFrame(update);
                return;
            }

            arena.forEach(row => row.fill(0));
            player.score = 0;
            player.lines = 0;
            player.level = 1;
            dropInterval = 1000;
            isGameOver = false;
            isPaused = false;
            updateScore();
            playerReset();
            document.getElementById('game-modal').classList.add('hidden');
            requestAnimationFrame(update);
        }

        document.addEventListener('keydown', event => {
            if (isGameOver || isPaused) return;
            if (event.keyCode === 37) playerMove(-1);        // Left Arrow
            else if (event.keyCode === 39) playerMove(1);   // Right Arrow
            else if (event.keyCode === 40) playerDrop();     // Down Arrow
            else if (event.keyCode === 38) playerRotate();   // Up Arrow
            else if (event.keyCode === 32) playerHardDrop(); // Space
        });
    </script>
</body>
</html>
